name: CCPlus weekly

# Runs the CCPlus generator weekly and on demand.
#
# Active: CLAUDE_CODE_OAUTH_TOKEN is set as a repo secret (uses subscription, no PAYG).
# The "generate" job guards against missing credentials so it no-ops cleanly if the secret
# is ever removed. See SETUP.md §A2 for credential options.
#
# Verify the claude-code-action version and input names against the current docs before
# enabling (https://github.com/anthropics/claude-code-action) — the AI tooling moves weekly.

on:
  # Weekly trigger comes from an external scheduler (e.g. cron-job.org) that POSTs a
  # repository_dispatch at 13:00 Asia/Manila. GitHub's own `schedule` fires hours late,
  # so it is intentionally not used here. See SETUP.md §A3 for the scheduler setup.
  repository_dispatch:
    types: [ccplus-weekly]
  workflow_dispatch:             # manual "Run workflow" button (the on-demand trigger)
    inputs:
      force:
        description: "Force generation even if no significant updates"
        type: boolean
        default: false

permissions:
  contents: write                # commit/push the new artifact + state, create releases
  id-token: write                # required by claude-code-action (OIDC token)
  issues: write                  # post run-log notifications as issue comments

concurrency:
  group: ccplus
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY" ] || [ -n "$OAUTH" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CCPlus dormant::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret set. Skipping generation. See SETUP.md to activate."
          fi

  generate:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT so the publish PR's `verify` check actually runs — events made with the
          # default GITHUB_TOKEN do not trigger other workflows, which would stall
          # auto-merge forever. Falls back to GITHUB_TOKEN so a missing secret never
          # breaks checkout; the auto-merge publish flow still requires CCPLUS_PAT.
          token: ${{ secrets.CCPLUS_PAT || github.token }}

      - name: Run CCPlus generator (Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          # Provide whichever credential you configured (one is enough):
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's built-in token so we don't need the Claude GitHub App installed:
          github_token: ${{ github.token }}
          claude_args: "--model opus --allowedTools Read,Write,Edit,WebFetch,Bash,Glob,Grep"
          prompt: |
            You are running the CCPlus pipeline in CI. Follow prompts/generate-ccplus.md exactly,
            using config/config.yaml and config/sources.yaml.
            - Research via WebFetch over the source URLs (WebSearch may be unavailable in CI; rely
              on WebFetch of the listed docs/release pages and the GitHub Releases API via `gh`).
            - Generate a new CCPlus version ONLY if the significance rubric is met; otherwise append
              a {"status":"no-update", ...} entry to state/runlog.json.
            - Run the cross-model review (spawn a Sonnet reviewer).
            - Update state/state.json, regenerate docs/index.html, and stage all changes.
            ${{ (github.event.inputs.force == 'true' || github.event.client_payload.force) && 'FORCE: generate even if not significant.' || '' }}

      # main is a protected branch (requires the `verify` check), so the bot cannot push
      # to it directly. Instead it commits to a short-lived branch and opens a PR with
      # auto-merge: the PAT-authored PR fires the pull_request event so the required
      # `verify` check runs (a GITHUB_TOKEN-authored PR would not), and the PR
      # squash-merges itself once the check passes. This keeps full branch protection.
      # Requires repo setting "Allow auto-merge" = ON (see SETUP.md §A3).
      - name: Commit to a branch, open an auto-merging PR, and release
        env:
          GH_TOKEN: ${{ secrets.CCPLUS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=CCPLUS_PAT missing::Add a repo secret CCPLUS_PAT (classic PAT, scopes repo+workflow) so the publish PR can run verify and auto-merge. See SETUP.md §A3."
            exit 1
          fi
          git config user.name  "ccplus-bot"
          git config user.email "ccplus-bot@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit (likely a no-update run)."
            exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          BRANCH="ccplus/run-$(date -u +%Y-%m-%d_%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "CCPlus: weekly run ($DAY)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "CCPlus: weekly run ($DAY)" \
            --body "Automated CCPlus run. Auto-merges once the \`verify\` check passes."
          # --auto only *enables* auto-merge and returns immediately. Enabling it can fail
          # if "Allow auto-merge" is off on the repo; surface that clearly.
          if ! gh pr merge "$BRANCH" --squash --auto --delete-branch; then
            echo "::error title=Auto-merge not enabled::Could not enable auto-merge. Turn on 'Allow auto-merge' in repo settings (SETUP.md §A3). The PR is open and will merge once that is on and verify passes."
            exit 1
          fi
          # Wait (bounded) for the merge to land, so the release is published only when the
          # artifact actually reached main. Releasing before verify passed would leave an
          # orphaned release whose Pages "View:" URL 404s.
          echo "Waiting for verify + auto-merge to complete..."
          merged=""
          for _ in $(seq 1 40); do
            state=$(gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null || echo "")
            if [ "$state" = "MERGED" ]; then merged=1; break; fi
            if [ "$state" = "CLOSED" ]; then break; fi
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning title=Publish pending::PR not merged (verify pending or failed); no release created. It will merge automatically once verify passes."
            exit 0
          fi
          # Release the new artifact, if any — now that it is on main (tag points at the
          # squash-merge commit on the default branch; asset is uploaded from disk).
          NEW=$(git show --name-only --pretty=format: HEAD | grep -E '^docs/artifacts/CCPlus_.*\.html$' || true)
          if [ -n "$NEW" ]; then
            BASENAME=$(basename "$NEW" .html)            # CCPlus_<timestamp>
            TS=${BASENAME#CCPlus_}
            gh release create "$TS" "$NEW" --title "$BASENAME" \
              --notes "Automated CCPlus run. View: https://claude-booster.github.io/CCPlus/artifacts/$(basename "$NEW")" \
              || echo "release step skipped"
          fi

      # Posts one comment per run to a single rolling "CCPlus run log" issue. GitHub emails repo
      # watchers (Watch -> All Activity) on issue comments, so you get an email for EVERY run —
      # both new-version and "no significant updates". Non-fatal. See SETUP.md section B.
      - name: Notify via GitHub issue comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE: "https://claude-booster.github.io/CCPlus/"
        run: |
          LAST=$(jq -c '.runs[-1]' state/runlog.json)
          STATUS=$(echo "$LAST" | jq -r '.status')
          TS=$(echo "$LAST" | jq -r '.timestamp')
          if [ "$STATUS" = "generated" ]; then
            VER=$(echo "$LAST" | jq -r '.version // "?"')
            ART=$(echo "$LAST" | jq -r '.artifact // ""')
            MSG=$(echo "$LAST" | jq -r '.summary // ""')
            TITLE="CCPlus v$VER published — new Claude Code updates"
            URL="${SITE}artifacts/$(basename "$ART")"
          else
            MSG=$(echo "$LAST" | jq -r '.note // ""')
            TITLE="CCPlus — no significant Claude Code updates"
            URL="$SITE"
          fi
          gh label create ccplus-runlog --repo "$REPO" --color D97757 \
            --description "CCPlus run notifications" >/dev/null 2>&1 || true
          NUM=$(gh issue list --repo "$REPO" --label ccplus-runlog --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            OUT=$(gh issue create --repo "$REPO" --title "📋 CCPlus run log" --label ccplus-runlog \
              --body "One comment is posted here per CCPlus run (weekly + on-demand). **Watch** this repo (top-right → Watch → All Activity) to receive them by email.")
            NUM=$(echo "$OUT" | grep -oE '[0-9]+$')
          fi
          BODY=$(printf '### %s\n\n%s\n\n**View:** %s\n\n_status: %s · run: %s_' \
            "$TITLE" "$MSG" "$URL" "$STATUS" "$TS")
          gh issue comment "$NUM" --repo "$REPO" --body "$BODY" \
            && echo "Commented on issue #$NUM" \
            || echo "::warning title=Notification failed::Could not comment on the run-log issue."

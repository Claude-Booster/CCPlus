<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg">

  <!-- ── Background ── -->
  <rect width="820" height="220" rx="14" fill="#1A1A19"/>
  <rect width="820" height="220" rx="14" fill="none" stroke="#2E2E2C" stroke-width="1.5"/>

  <!-- ── Radar section (left) ── -->
  <defs>
    <clipPath id="rc">
      <circle cx="120" cy="110" r="88"/>
    </clipPath>
  </defs>

  <!-- Cross-hair lines -->
  <g stroke="#D97757" stroke-width="0.6" opacity="0.14">
    <line x1="32"  y1="110" x2="208" y2="110"/>
    <line x1="120" y1="22"  x2="120" y2="198"/>
    <line x1="57"  y1="47"  x2="183" y2="173"/>
    <line x1="183" y1="47"  x2="57"  y2="173"/>
  </g>

  <!-- Static concentric rings -->
  <circle cx="120" cy="110" r="29" fill="none" stroke="#D97757" stroke-width="0.8" opacity="0.22"/>
  <circle cx="120" cy="110" r="58" fill="none" stroke="#D97757" stroke-width="0.8" opacity="0.16"/>
  <circle cx="120" cy="110" r="87" fill="none" stroke="#D97757" stroke-width="1.5" opacity="0.38"/>

  <!-- Sweep cone (rotates) — clipped to radar boundary -->
  <path d="M 120 110 L 120 22 A 88 88 0 0 1 162 34 Z"
        fill="#D97757" opacity="0.09" clip-path="url(#rc)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 120 110" to="360 120 110" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Sweep line (rotates) -->
  <line x1="120" y1="110" x2="120" y2="22"
        stroke="#D97757" stroke-width="1.5" opacity="0.72" clip-path="url(#rc)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 120 110" to="360 120 110" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Pulse rings (expand and fade from center) -->
  <circle cx="120" cy="110" r="10" fill="none" stroke="#D97757" stroke-width="1.5">
    <animate attributeName="r"       from="10" to="88" dur="4s" begin="0s"    repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="4s" begin="0s"    repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="110" r="10" fill="none" stroke="#D97757" stroke-width="1.5">
    <animate attributeName="r"       from="10" to="88" dur="4s" begin="1.33s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="4s" begin="1.33s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="110" r="10" fill="none" stroke="#D97757" stroke-width="1.5">
    <animate attributeName="r"       from="10" to="88" dur="4s" begin="2.66s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="4s" begin="2.66s" repeatCount="indefinite"/>
  </circle>

  <!-- Center dot -->
  <circle cx="120" cy="110" r="5"  fill="#D97757"/>
  <circle cx="120" cy="110" r="9"  fill="none" stroke="#D97757" stroke-width="1" opacity="0.45"/>

  <!-- Blip signals (appear as sweep passes over them) -->
  <!-- Blip A — upper-left quadrant, r≈42 -->
  <circle cx="102" cy="72" r="3.5" fill="#D97757">
    <animate attributeName="opacity"
      values="0;0;0;1;0.7;0.2;0"
      keyTimes="0;0.62;0.76;0.81;0.89;0.96;1"
      dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Blip B — right side, r≈55 -->
  <circle cx="162" cy="75" r="3" fill="#D97757">
    <animate attributeName="opacity"
      values="0;0;0;1;0.7;0.2;0"
      keyTimes="0;0.08;0.25;0.32;0.42;0.52;1"
      dur="4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Blip C — lower-right, r≈50 -->
  <circle cx="158" cy="142" r="2.5" fill="#D97757">
    <animate attributeName="opacity"
      values="0;0;0;1;0.7;0.2;0"
      keyTimes="0;0.52;0.67;0.72;0.82;0.90;1"
      dur="4s" begin="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Divider ── -->
  <line x1="232" y1="28" x2="232" y2="192" stroke="#2A2A28" stroke-width="1.5"/>

  <!-- ── Text section (right) ── -->

  <!-- Eyebrow / tag -->
  <text x="262" y="72"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#D97757">AUTOMATED · WEEKLY · CITED</text>

  <!-- Main title -->
  <text x="260" y="140"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="64" font-weight="700" fill="#F5F4EE">CCPlus</text>

  <!-- Coral accent bar under title -->
  <rect x="261" y="148" width="78" height="3" rx="1.5" fill="#D97757"/>

  <!-- Subtitle -->
  <text x="261" y="170"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="15" fill="#787872">Claude Code Plus — what&#39;s new, every week</text>

  <!-- Footer metadata -->
  <text x="262" y="195"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" fill="#3C3C3A">Opus generates · Sonnet reviews · GitHub Actions · GitHub Pages</text>

</svg>
